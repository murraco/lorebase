[project]
name = "lorebase"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.121.0",
    "celery[redis]>=5.6.3",
    "django>=6.1",
    "django-environ>=0.14.0",
    "djangorestframework>=3.17.2",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "pymupdf4llm>=1.28.2",
    "python-frontmatter>=1.3.0",
    "tiktoken>=0.13.0",
    "voyageai>=0.5.0",
]

[dependency-groups]
dev = [
    "django-stubs>=6.0.8",
    "factory-boy>=3.3.3",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.13.0",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "--cov=. --cov-report=term-missing"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "SIM"]

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main"]
mypy_path = "."
ignore_missing_imports = true
# tests/ excluded: factory_boy's DjangoModelFactory returns model instances
# via metaclass magic mypy can't see, so every `SomeFactory()` call type-checks
# as `SomeFactory` instead of the model it creates. Gradual typing (per the
# roadmap) is scoped to core/ and rag/ anyway, not test code.
exclude = ["migrations/", "tests/"]

[tool.django-stubs]
django_settings_module = "config.settings.test"
