[project]
name = "lorebase"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.121.0",
    "celery[redis]>=5.6.3",
    "django>=6.1",
    "django-environ>=0.14.0",
    "djangorestframework>=3.18.0",
    "drf-spectacular>=0.30.0",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "pymupdf4llm>=1.28.2",
    "python-frontmatter>=1.3.0",
    "requests>=2.34.2",
    "sentence-transformers>=5.1.2",
    "tiktoken>=0.13.0",
    "voyageai>=0.5.0",
]

[tool.uv.sources]
# CPU-only build: nothing here needs a GPU, and the default (CUDA) wheels
# are gigabytes larger for no benefit in a container with no GPU access.
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "django-stubs>=6.0.8",
    "factory-boy>=3.3.3",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.13.0",
    "responses>=0.26.2",
    "ruff>=0.16.1",
    "types-requests>=2.33.0.20260712",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "--cov=. --cov-report=term-missing"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "SIM"]

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main"]
mypy_path = "."
ignore_missing_imports = true
# tests/ excluded: factory_boy's DjangoModelFactory returns model instances
# via metaclass magic mypy can't see, so every `SomeFactory()` call type-checks
# as `SomeFactory` instead of the model it creates. Gradual typing is
# scoped to core/ and rag/ anyway, not test code.
exclude = ["migrations/", "tests/"]

[tool.django-stubs]
django_settings_module = "config.settings.test"
