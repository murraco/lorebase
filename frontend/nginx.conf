server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin proxy for the API: the browser only ever talks to this
    # Nginx, which forwards /api/* to the backend container over the
    # Docker network. Same origin is what makes the session cookie (and
    # CSRF) work without any cross-origin cookie configuration.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        # $host (not $http_host) strips the port from the Host header.
        # Django's CSRF check compares the browser's Origin (which DOES
        # include the port, e.g. http://localhost:8080) against a
        # same-origin URL it builds from the Host header it receives — with
        # $host, that comparison becomes "http://localhost:8080" vs
        # "http://localhost" and fails every time.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The chat endpoint streams Server-Sent Events — buffering here
        # would hold the whole response until it closes, defeating the
        # point of streaming (Django already sets X-Accel-Buffering: no,
        # but that only takes effect if Nginx isn't buffering to begin
        # with).
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Angular's client-side router owns everything else — unknown paths
    # fall back to index.html instead of a raw Nginx 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
