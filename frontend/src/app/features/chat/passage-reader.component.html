<!-- A button, not a div: dismissing by clicking outside has to be
     reachable by keyboard too. -->
<button type="button" class="scrim" aria-label="Close passage" (click)="closed.emit()"></button>

<aside class="reader" role="dialog" aria-modal="true" aria-label="Cited passage">
  <header>
    <span class="reader-n">{{ index() }}</span>
    <div class="reader-id">
      <p class="reader-heading">{{ citation().heading_path || citation().path }}</p>
      <p class="reader-meta">
        {{ citation().path }} · lines {{ citation().start_line }}–{{ citation().end_line }}
      </p>
    </div>
    <button type="button" class="reader-close" aria-label="Close" (click)="closed.emit()">×</button>
  </header>
  <pre>{{ citation().content }}</pre>
</aside>
