<div class="sources" [class.folded]="collapsed()">
  <div class="section-head">
    <button
      type="button"
      class="section-label"
      [attr.aria-expanded]="!collapsed()"
      (click)="toggled.emit()"
    >
      <svg class="chevron" viewBox="0 0 12 12" aria-hidden="true">
        <polyline points="4 2 8 6 4 10" />
      </svg>
      Sources
      <span class="section-count">{{ sources().length }}</span>
    </button>
    <!-- On the header, not below the list: the list scrolls, so a button
         under it scrolled out of view and read as missing. -->
    <button
      type="button"
      class="section-add"
      title="Add source"
      aria-label="Add source"
      (click)="add.emit()"
    >
      <svg viewBox="0 0 14 14" aria-hidden="true">
        <line x1="7" y1="2.5" x2="7" y2="11.5" />
        <line x1="2.5" y1="7" x2="11.5" y2="7" />
      </svg>
    </button>
  </div>

  <div class="rows">
    @for (source of sources(); track source.id) {
      <div class="source" [class.off]="!source.enabled">
        <span class="type-icon" [title]="source.type === 'github' ? 'GitHub' : 'Local folder'">
          @if (source.type === 'github') {
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path
                d="M8 1a7 7 0 0 0-2.21 13.64c.35.06.48-.15.48-.34v-1.2c-1.95.42-2.36-.94-2.36-.94-.32-.81-.78-1.03-.78-1.03-.64-.43.05-.42.05-.42.7.05 1.07.72 1.07.72.62 1.06 1.63.76 2.03.58.06-.45.24-.76.44-.94-1.56-.18-3.2-.78-3.2-3.46 0-.76.27-1.39.72-1.87-.07-.18-.31-.9.07-1.87 0 0 .59-.19 1.94.71a6.7 6.7 0 0 1 3.53 0c1.35-.9 1.94-.71 1.94-.71.38.97.14 1.69.07 1.87.45.48.72 1.11.72 1.87 0 2.69-1.64 3.28-3.21 3.45.25.22.48.64.48 1.3v1.92c0 .19.13.4.49.34A7 7 0 0 0 8 1Z"
              />
            </svg>
          } @else {
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M1.5 4h4l1.2 1.6h7.8v7.4h-13V4Z" />
            </svg>
          }
        </span>
        <a
          class="source-text"
          [routerLink]="['/corpus']"
          [queryParams]="{ source: source.id }"
          [title]="'Browse what was indexed from ' + source.name"
          (click)="navigated.emit()"
        >
          <span class="name">{{ source.name }}</span>
          @if (statusLabel(source); as label) {
            <span class="status-label">{{ label }}</span>
          }
        </a>
        <span
          class="dot"
          [class]="source.status"
          [class.working]="isInFlight(source)"
          [class.off]="!source.enabled"
          [title]="source.enabled ? sourceTitle(source) : 'Not used for answers'"
        ></span>
        @if (source.status === 'pending' || source.status === 'error') {
          <button
            type="button"
            class="row-btn"
            title="Sync now"
            aria-label="Sync now"
            [disabled]="syncingId() === source.id"
            (click)="sync.emit(source)"
          >
            ⟳
          </button>
        }
      </div>
    } @empty {
      @if (loading()) {
        <p class="empty">Loading…</p>
      } @else if (!hasError()) {
        <button type="button" class="empty-action" (click)="add.emit()">
          + Add a source to start
        </button>
      }
    }
  </div>
</div>
